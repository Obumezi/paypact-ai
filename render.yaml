services:
  - type: web
    name: paypact-ai-escrow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false